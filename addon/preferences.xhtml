<vbox id="math-tidy-prefs" xmlns:html="http://www.w3.org/1999/xhtml" onload="MathTidyPrefs.init()">
	<groupbox>
		<label><html:h2 data-l10n-id="math-tidy-pref-general"/></label>
		<hbox align="center">
			<html:label data-l10n-id="math-tidy-pref-ui-language"/>
			<menulist id="math-tidy-ui-language" preference="extensions.math-tidy.uiLanguage" native="true">
				<menupopup>
					<menuitem data-l10n-id="math-tidy-pref-ui-language-auto" value="auto"/>
					<menuitem label="English" value="en"/>
					<menuitem label="한국어" value="ko"/>
				</menupopup>
			</menulist>
		</hbox>
		<hbox align="center">
			<html:label data-l10n-id="math-tidy-pref-language"/>
			<html:input type="text" data-l10n-id="math-tidy-pref-language-input" preference="extensions.math-tidy.language"/>
		</hbox>
	</groupbox>

	<groupbox>
		<label><html:h2 data-l10n-id="math-tidy-pref-extraction"/></label>
		<hbox align="center">
			<html:label data-l10n-id="math-tidy-pref-provider"/>
			<menulist id="math-tidy-provider" preference="extensions.math-tidy.provider" native="true">
				<menupopup>
					<menuitem data-l10n-id="math-tidy-pref-provider-anthropic" value="anthropic"/>
					<menuitem data-l10n-id="math-tidy-pref-provider-openai" value="openai"/>
					<menuitem data-l10n-id="math-tidy-pref-provider-gemini" value="gemini"/>
				</menupopup>
			</menulist>
		</hbox>

		<!-- One block per provider; only the selected provider's block is shown -->
		<vbox id="math-tidy-provider-anthropic" class="math-tidy-provider" hidden="true">
			<hbox align="center">
				<html:label data-l10n-id="math-tidy-pref-api-key"/>
				<html:input type="password" style="flex: 1" preference="extensions.math-tidy.anthropic.apiKey"/>
			</hbox>
			<hbox align="center">
				<html:label data-l10n-id="math-tidy-pref-model"/>
				<menulist id="math-tidy-anthropic-model" preference="extensions.math-tidy.anthropic.model" native="true">
					<menupopup/>
				</menulist>
				<button data-l10n-id="math-tidy-pref-refresh-models" oncommand="MathTidyPrefs.refreshModels('anthropic', true)"/>
				<html:span id="math-tidy-anthropic-status"/>
			</hbox>
		</vbox>

		<vbox id="math-tidy-provider-openai" class="math-tidy-provider" hidden="true">
			<hbox align="center">
				<html:label data-l10n-id="math-tidy-pref-api-key"/>
				<html:input type="password" style="flex: 1" preference="extensions.math-tidy.openai.apiKey"/>
			</hbox>
			<hbox align="center">
				<html:label data-l10n-id="math-tidy-pref-base-url"/>
				<html:input type="text" style="flex: 1" preference="extensions.math-tidy.openai.baseURL"/>
			</hbox>
			<hbox align="center">
				<html:label data-l10n-id="math-tidy-pref-model"/>
				<menulist id="math-tidy-openai-model" preference="extensions.math-tidy.openai.model" native="true">
					<menupopup/>
				</menulist>
				<button data-l10n-id="math-tidy-pref-refresh-models" oncommand="MathTidyPrefs.refreshModels('openai', true)"/>
				<html:span id="math-tidy-openai-status"/>
			</hbox>
		</vbox>

		<vbox id="math-tidy-provider-gemini" class="math-tidy-provider" hidden="true">
			<hbox align="center">
				<html:label data-l10n-id="math-tidy-pref-api-key"/>
				<html:input type="password" style="flex: 1" preference="extensions.math-tidy.gemini.apiKey"/>
			</hbox>
			<hbox align="center">
				<html:label data-l10n-id="math-tidy-pref-model"/>
				<menulist id="math-tidy-gemini-model" preference="extensions.math-tidy.gemini.model" native="true">
					<menupopup/>
				</menulist>
				<button data-l10n-id="math-tidy-pref-refresh-models" oncommand="MathTidyPrefs.refreshModels('gemini', true)"/>
				<html:span id="math-tidy-gemini-status"/>
			</hbox>
		</vbox>

		<hbox align="center">
			<html:label data-l10n-id="math-tidy-pref-input"/>
			<menulist preference="extensions.math-tidy.input" native="true">
				<menupopup>
					<menuitem data-l10n-id="math-tidy-pref-input-pdf" value="pdf"/>
					<menuitem data-l10n-id="math-tidy-pref-input-text" value="text"/>
				</menupopup>
			</menulist>
		</hbox>
	</groupbox>

	<html:p data-l10n-id="math-tidy-pref-models-note"/>
	<html:p data-l10n-id="math-tidy-pref-key-note"/>
</vbox>
